<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B45"/>
      <stop offset="100%" stop-color="#1D3B5C"/>
    </linearGradient>
    <linearGradient id="goldFin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#B79661"/>
      <stop offset="100%" stop-color="#8C6A34"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bgFin)"/>
  <!-- Investment Coins & Growth Bars -->
  <g transform="translate(400, 215)">
    <!-- Ascending bars -->
    <rect x="-140" y="30" width="45" height="60" rx="4" fill="#FFFFFF" fill-opacity="0.2"/>
    <rect x="-80" y="-10" width="45" height="100" rx="4" fill="#FFFFFF" fill-opacity="0.3"/>
    <rect x="-20" y="-50" width="45" height="140" rx="4" fill="#FFFFFF" fill-opacity="0.4"/>
    <rect x="40" y="-90" width="45" height="180" rx="4" fill="url(#goldFin)" fill-opacity="0.8"/>
    <rect x="100" y="-130" width="45" height="220" rx="4" fill="url(#goldFin)"/>
    <!-- Growth trajectory curve -->
    <path d="M-150 40 Q-40 -40 120 -140" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
    <circle cx="120" cy="-140" r="7" fill="#FFFFFF"/>
  </g>
  <text x="400" y="445" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="bold" fill="#D9BD8E" text-anchor="middle" letter-spacing="3">RECHERCHE DE FINANCEMENTS &amp; SUBSIDES</text>
  <text x="400" y="470" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">DOSSIERS BANCAIRES • PRIMES RÉGIONALES • CRÉDITS D'INVESTISSEMENT</text>
</svg>
