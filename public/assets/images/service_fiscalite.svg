<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFisc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B45"/>
      <stop offset="100%" stop-color="#1D3B5C"/>
    </linearGradient>
    <linearGradient id="goldFisc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#B79661"/>
      <stop offset="100%" stop-color="#8C6A34"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bgFisc)"/>
  <!-- Decorative Scales of Justice & Optimization Graph -->
  <g transform="translate(400, 210)" stroke="url(#goldFisc)" stroke-width="2.5" fill="none">
    <!-- Center pillar -->
    <line x1="0" y1="-100" x2="0" y2="90"/>
    <line x1="-50" y1="90" x2="50" y2="90" stroke-width="4"/>
    <circle cx="0" cy="-105" r="10" fill="url(#goldFisc)"/>
    <!-- Balance beam -->
    <line x1="-120" y1="-80" x2="120" y2="-80" stroke-width="3"/>
    <!-- Left pan -->
    <line x1="-120" y1="-80" x2="-150" y2="-20"/>
    <line x1="-120" y1="-80" x2="-90" y2="-20"/>
    <path d="M-160 -20 Q-120 0 -80 -20 Z" fill="url(#goldFisc)" fill-opacity="0.3"/>
    <!-- Right pan -->
    <line x1="120" y1="-80" x2="90" y2="-20"/>
    <line x1="120" y1="-80" x2="150" y2="-20"/>
    <path d="M80 -20 Q120 0 160 -20 Z" fill="url(#goldFisc)" fill-opacity="0.3"/>
    <!-- Ascending Trend Graph behind -->
    <polyline points="-260,60 -180,20 -100,35 -20,-30 60,-15 140,-75 220,-110" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="400" y="445" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="bold" fill="#D9BD8E" text-anchor="middle" letter-spacing="3">FISCALITÉ DES SOCIÉTÉS &amp; DES DIRIGEANTS</text>
  <text x="400" y="470" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">OPTIMISATION ISOC 20% • DIVIDENDES VVPR-BIS • ASSISTANCE CONTRÔLE ITAA</text>
</svg>
