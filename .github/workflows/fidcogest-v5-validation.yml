name: FIDCOGEST V5 — validation technique
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Build frontend and server
        run: npm run build
      - name: Security static tests
        run: npm run test:security-static --if-present
      - name: Storage V6 static checks
        run: node --test tests/storage-v6-static.test.mjs
      - name: Bootstrap CLI build
        run: npm run build:bootstrap --if-present
